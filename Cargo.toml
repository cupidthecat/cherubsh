[workspace]
members = [
  "crates/common",
  "crates/lexer",
  "crates/parser",
  "crates/expander",
  "crates/builtins",
  "crates/exec",
  "crates/lineedit",
  "crates/readline-ffi",
  "crates/history-ffi",
  "crates/shell",
  "crates/test-harness",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/cupidthecat/cherubsh"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
