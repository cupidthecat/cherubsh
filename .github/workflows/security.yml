name: dependency-security

on:
  pull_request:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low

  rustsec-audit:
    name: rustsec-audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the lockfile-compatible cargo-audit release
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Check out the current RustSec advisory database
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RustSec/advisory-db
          ref: main
          path: .rustsec-advisory-db

      - name: Check Cargo.lock against the RustSec advisory database
        run: cargo audit --db .rustsec-advisory-db --file Cargo.lock

  rustsec-audit-fuzz:
    name: rustsec-audit-fuzz
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the lockfile-compatible cargo-audit release
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Check out the current RustSec advisory database
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RustSec/advisory-db
          ref: main
          path: .rustsec-advisory-db

      - name: Check fuzz/Cargo.lock against the RustSec advisory database
        run: cargo audit --db .rustsec-advisory-db --file fuzz/Cargo.lock
