name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-linux-archives:
    name: build-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal

      - name: Verify the release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: ./tools/check-release-tag.sh "${RELEASE_TAG}"

      - name: Verify the workspace
        run: cargo test --workspace --locked

      - name: Build the Linux release binary
        run: cargo build --release --locked -p cherubsh

      - name: Build the Readline development files
        run: ./tools/build-readline.sh

      - name: Create the release archive
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          case "${RELEASE_TAG}" in
            v*) RELEASE_VERSION="${RELEASE_TAG#v}" ;;
            *)
              echo "error: release tags must start with v" >&2
              exit 2
              ;;
          esac
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            ./tools/package-release.sh \
              --version "${RELEASE_VERSION}" \
              --binary target/release/cherubsh \
              --output dist
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            ./tools/package-readline-dev.sh \
              --version "${RELEASE_VERSION}" \
              --input target/readline \
              --output dist
          (
            cd dist
            sha256sum cherubsh-*.tar.gz > SHA256SUMS
          )
          (
            cd dist
            sha256sum --check SHA256SUMS
          )

      - name: Preserve the native release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          path: |
            dist/cherubsh-[0-9]*.tar.gz
            dist/cherubsh-readline-dev-*.tar.gz
          if-no-files-found: error

  publish:
    name: publish-release
    needs: build-linux-archives
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Collect the native release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create the combined checksum manifest
        run: |
          cd dist
          sha256sum cherubsh-*.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --generate-notes \
            --title "CherubSH ${RELEASE_TAG}" \
            dist/*
