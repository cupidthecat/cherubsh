name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-release-source:
    name: verify-release-source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal

      - name: Verify the release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: ./tools/check-release-tag.sh "${RELEASE_TAG}"

      - name: Fetch protected main
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Verify the release source
        run: ./tools/check-release-source.sh HEAD

  build-linux-archives:
    name: build-${{ matrix.arch }}
    needs: verify-release-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf \
            bison \
            build-essential \
            curl \
            git \
            gpgv \
            libncurses-dev \
            patch \
            perl \
            python3 \
            texinfo \
            util-linux

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal

      - name: Verify the release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: ./tools/check-release-tag.sh "${RELEASE_TAG}"

      - name: Fetch and verify upstream sources
        run: ./tools/fetch-upstream.sh

      - name: Build the pinned Bash oracle
        run: ./oracle/build-bash-5.3.15.sh

      - name: Verify the workspace
        run: cargo test --workspace --locked

      - name: Build the Linux release binary
        run: cargo build --release --locked -p cherubsh

      - name: Build the Readline development files
        run: ./tools/build-readline.sh

      - name: Create the release archive
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          case "${RELEASE_TAG}" in
            v*) RELEASE_VERSION="${RELEASE_TAG#v}" ;;
            *)
              echo "error: release tags must start with v" >&2
              exit 2
              ;;
          esac
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            ./tools/package-release.sh \
              --version "${RELEASE_VERSION}" \
              --binary target/release/cherubsh \
              --output dist
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            ./tools/package-readline-dev.sh \
              --version "${RELEASE_VERSION}" \
              --input target/readline \
              --output dist
          (
            cd dist
            sha256sum cherubsh-*.tar.gz > SHA256SUMS
          )
          (
            cd dist
            sha256sum --check SHA256SUMS
          )

      - name: Preserve the native release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.arch }}
          path: |
            dist/cherubsh-[0-9]*.tar.gz
            dist/cherubsh-readline-dev-*.tar.gz
          if-no-files-found: error

  build-sbom:
    name: build-sbom
    needs: verify-release-source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal

      - name: Verify the release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: ./tools/check-release-tag.sh "${RELEASE_TAG}"

      - name: Create CycloneDX SBOMs
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            cargo cyclonedx \
              --manifest-path crates/shell/Cargo.toml \
              --format json \
              --all \
              --target all \
              --spec-version 1.5
          ./tools/prepare-sboms.py \
            --version "${RELEASE_VERSION}" \
            --output dist \
            crates/*/*.cdx.json

      - name: Preserve the CycloneDX SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-sbom
          path: dist/cherubsh*.cdx.json
          if-no-files-found: error

  publish:
    name: publish-release
    needs:
      - build-linux-archives
      - build-sbom
    runs-on: ubuntu-24.04
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Collect the native release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create the combined checksum manifest
        run: |
          cd dist
          sha256sum cherubsh-*.tar.gz cherubsh*.cdx.json > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Attest the release assets
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            dist/cherubsh-*.tar.gz
            dist/cherubsh*.cdx.json
            dist/SHA256SUMS

      - name: Attach the CycloneDX SBOM to the shell archives
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: dist/cherubsh-[0-9]*-*.tar.gz
          sbom-path: dist/cherubsh.cdx.json

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --notes-file "release-notes/${RELEASE_TAG}.md" \
            --title "CherubSH ${RELEASE_TAG}" \
            dist/*
