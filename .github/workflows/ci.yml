name: parity

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: parity-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf \
            bison \
            bubblewrap \
            build-essential \
            curl \
            git \
            gpgv \
            libncurses-dev \
            patch \
            perl \
            python3 \
            texinfo \
            util-linux

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --component clippy,rustfmt

      - name: Permit Bubblewrap user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Verify and prepare upstream sources
        run: ./tools/fetch-upstream.sh

      - name: Run every parity gate
        env:
          RUN_BRUSH_PARITY: "1"
          RUN_OILS_PARITY: "1"
        run: ./tools/run-parity.sh

      - name: Preserve parity reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: parity-reports-${{ matrix.arch }}
          path: |
            parity.log
            target/parity
          if-no-files-found: ignore

  linux:
    name: linux
    needs: parity
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every native parity job
        env:
          PARITY_RESULT: ${{ needs.parity.result }}
        run: test "${PARITY_RESULT}" = success
